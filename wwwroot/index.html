<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BookLister - Track Your Books</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --ios-bg: #F2F2F7;
            --ios-card-bg: #FFFFFF;
            --ios-grouped-bg: #FFFFFF;
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-orange: #FF9500;
            --ios-red: #FF3B30;
            --ios-text-primary: #000000;
            --ios-text-secondary: #8E8E93;
            --ios-border: #E5E5EA;
            --ios-separator: #C6C6C8;
            --ios-input-bg: #EFEFF4;
            --ios-radius: 12px;
            --ios-shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --ios-bg: #000000;
                --ios-card-bg: #1C1C1E;
                --ios-grouped-bg: #1C1C1E;
                --ios-blue: #0A84FF;
                --ios-green: #30D158;
                --ios-orange: #FF9F0A;
                --ios-red: #FF453A;
                --ios-text-primary: #FFFFFF;
                --ios-text-secondary: #8E8E93;
                --ios-border: #38383A;
                --ios-separator: #38383A;
                --ios-input-bg: #2C2C2E;
                --ios-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--ios-bg);
            color: var(--ios-text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
            -webkit-font-smoothing: antialiased;
        }

        /* Navigation Bar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(249, 249, 249, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--ios-separator);
            padding: 12px 20px;
        }

        @media (prefers-color-scheme: dark) {
            .navbar {
                background: rgba(28, 28, 30, 0.82);
            }
        }

        .navbar-content {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Section Header */
        .section-header {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--ios-text-secondary);
            letter-spacing: -0.08px;
            margin: 20px 8px 8px 8px;
        }

        /* Inset Group Cards */
        .ios-card {
            background: var(--ios-card-bg);
            border-radius: var(--ios-radius);
            padding: 16px;
            box-shadow: var(--ios-shadow);
            margin-bottom: 16px;
            border: 0.5px solid var(--ios-border);
        }

        /* Stats Grid */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-box {
            background: var(--ios-card-bg);
            padding: 14px 10px;
            border-radius: var(--ios-radius);
            text-align: center;
            box-shadow: var(--ios-shadow);
            border: 0.5px solid var(--ios-border);
        }

        .stat-number {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--ios-text-primary);
        }

        .stat-box.stat-read .stat-number {
            color: var(--ios-green);
        }

        .stat-box.stat-reading .stat-number {
            color: var(--ios-blue);
        }

        .stat-box.stat-unfinished .stat-number {
            color: var(--ios-orange);
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--ios-text-secondary);
            margin-top: 2px;
        }

        /* Form Controls */
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--ios-text-secondary);
            margin-left: 4px;
        }

        .ios-input, .ios-select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--ios-border);
            border-radius: 10px;
            font-size: 16px;
            background: var(--ios-input-bg);
            color: var(--ios-text-primary);
            transition: border-color 0.15s ease-in-out;
            appearance: none;
            -webkit-appearance: none;
        }

        .ios-select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%208E8E93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
        }

        .ios-input:focus, .ios-select:focus {
            outline: none;
            border-color: var(--ios-blue);
            background: var(--ios-card-bg);
        }

        .btn-ios-primary {
            background: var(--ios-blue);
            color: #FFFFFF;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 6px;
            transition: opacity 0.15s ease;
        }

        .btn-ios-primary:active {
            opacity: 0.7;
        }

        /* Search Box */
        .search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            background: var(--ios-input-bg);
            color: var(--ios-text-primary);
        }

        .search-box input:focus {
            outline: none;
            background: var(--ios-card-bg);
            box-shadow: inset 0 0 0 1px var(--ios-blue);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ios-text-secondary);
            font-size: 14px;
            pointer-events: none;
        }

        /* Book Item Card */
        .book-card {
            background: var(--ios-card-bg);
            border-radius: var(--ios-radius);
            padding: 14px 16px;
            margin-bottom: 8px;
            border: 0.5px solid var(--ios-border);
            box-shadow: var(--ios-shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.15s ease;
        }

        .book-card:active {
            transform: scale(0.99);
        }

        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .book-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--ios-text-primary);
        }

        .book-author {
            color: var(--ios-text-secondary);
            font-size: 0.88rem;
            margin-top: 2px;
        }

        .book-dates {
            color: var(--ios-text-secondary);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-reading {
            background: rgba(0, 122, 255, 0.12);
            color: var(--ios-blue);
        }

        .badge-finished {
            background: rgba(52, 199, 89, 0.12);
            color: var(--ios-green);
        }

        .badge-unfinished {
            background: rgba(255, 149, 0, 0.12);
            color: var(--ios-orange);
        }

        .book-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding-top: 6px;
            border-top: 0.5px solid var(--ios-border);
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.15s;
        }

        .btn-action:active {
            opacity: 0.6;
        }

        .btn-finish {
            background: rgba(52, 199, 89, 0.12);
            color: var(--ios-green);
        }

        .btn-reading {
            background: rgba(0, 122, 255, 0.12);
            color: var(--ios-blue);
        }

        .btn-unfinished {
            background: rgba(255, 149, 0, 0.12);
            color: var(--ios-orange);
        }

        .btn-delete {
            background: rgba(255, 59, 48, 0.12);
            color: var(--ios-red);
            margin-left: auto;
        }

        .empty-state {
            text-align: center;
            padding: 24px 16px;
            color: var(--ios-text-secondary);
            font-size: 0.95rem;
            background: var(--ios-card-bg);
            border-radius: var(--ios-radius);
            border: 0.5px dashed var(--ios-border);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-content">
            <h1 class="navbar-title">📖 BookLister</h1>
        </div>
    </div>

    <div class="app-container">
        <!-- Stats Display -->
        <div id="stats-section"
             hx-get="/stats"
             hx-trigger="load, booksUpdated from:body"
             hx-swap="innerHTML">
            <!-- Loaded dynamically -->
        </div>

        <!-- Add Book Form Card -->
        <div class="section-header">New Entry</div>
        <div class="ios-card">
            <form hx-post="/books"
                  hx-on::after-request="if(event.detail.successful) this.reset()"
                  hx-swap="none">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="title">TITLE</label>
                        <input type="text" id="title" name="title" class="ios-input" required placeholder="Title">
                    </div>
                    <div class="form-group">
                        <label for="author">AUTHOR</label>
                        <input type="text" id="author" name="author" class="ios-input" required placeholder="Author">
                    </div>
                    <div class="form-group">
                        <label for="start_date">START DATE</label>
                        <input type="date" id="start_date" name="start_date" class="ios-input">
                    </div>
                    <div class="form-group">
                        <label for="end_date">END DATE</label>
                        <input type="date" id="end_date" name="end_date" class="ios-input">
                    </div>
                    <div class="form-group">
                        <label for="status">STATUS</label>
                        <select id="status" name="status" class="ios-select">
                            <option value="reading">Currently Reading</option>
                            <option value="finished">Finished</option>
                            <option value="unfinished">Unfinished</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-ios-primary">Add Book</button>
                </div>
            </form>
        </div>

        <!-- Currently Reading Section -->
        <div class="section-header">Currently Reading</div>
        <div id="reading-list"
             hx-get="/books?status=reading"
             hx-trigger="load, booksUpdated from:body"
             hx-swap="innerHTML">
        </div>

        <!-- Search Read Books Section -->
        <div class="section-header">Search Finished Books</div>
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text"
                   name="q"
                   placeholder="Search finished books..."
                   hx-get="/books/search"
                   hx-trigger="keyup changed delay:300ms, search, load, booksUpdated from:body"
                   hx-target="#search-results"
                   hx-swap="innerHTML">
        </div>
        <div id="search-results">
            <!-- Search results loaded dynamically -->
        </div>

        <!-- Unfinished Books Section -->
        <div class="section-header">Unfinished Books</div>
        <div id="unfinished-list"
             hx-get="/books?status=unfinished"
             hx-trigger="load, booksUpdated from:body"
             hx-swap="innerHTML">
        </div>

        <!-- All Books List Section -->
        <div class="section-header">All Books</div>
        <div id="all-list"
             hx-get="/books"
             hx-trigger="load, booksUpdated from:body"
             hx-swap="innerHTML">
        </div>
    </div>
</body>
</html>
